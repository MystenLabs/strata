[package]
name = "strata"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
internal-profiling = ["store/internal-profiling"]

[dependencies]
core.workspace = true
store.workspace = true

[workspace]
members = [
    ".",
    "crates/bench",
    "crates/core",
    "crates/gc",
    "crates/index",
    "crates/lsm",
    "crates/realistic-bench",
    "crates/segment",
    "crates/store",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/walrus-foundation/strata"

[workspace.dependencies]
bcs = "0.1.6"
libc = "0.2"
prometheus = "0.14.0"
rocksdb = { version = "0.22.0", default-features = false, features = ["lz4", "multi-threaded-cf", "snappy", "zlib", "zstd"] }
serde = { version = "1", features = ["derive"] }
serde_with = "3.20"
sha2 = "0.10"
core = { path = "crates/core" }
gc = { path = "crates/gc" }
index = { path = "crates/index" }
lsm = { path = "crates/lsm" }
segment = { path = "crates/segment" }
store = { path = "crates/store" }
tempfile = "3"
thiserror = "2"
tokio = { version = "1.49", features = ["macros", "rt-multi-thread", "time"] }
typed-store = { path = "/Users/sadhansood/dev/walrus/crates/typed-store" }
xxhash-rust = { version = "0.8.15", features = ["xxh3"] }
