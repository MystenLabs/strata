[package]
name = "strata"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
internal-profiling = ["strata-store/internal-profiling"]

[dependencies]
strata-core.workspace = true
strata-store.workspace = true

[workspace]
members = [
    ".",
    "crates/strata-bench",
    "crates/strata-accounting",
    "crates/strata-core",
    "crates/strata-gc",
    "crates/strata-index",
    "crates/strata-segment",
    "crates/strata-store",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/walrus-foundation/strata"

[workspace.dependencies]
bcs = "0.1.6"
libc = "0.2"
prometheus = "0.14.0"
rocksdb = { version = "0.22.0", default-features = false, features = ["lz4", "multi-threaded-cf", "snappy", "zlib", "zstd"] }
serde = { version = "1", features = ["derive"] }
serde_with = "3.20"
sha2 = "0.10"
strata-accounting = { path = "crates/strata-accounting" }
strata-core = { path = "crates/strata-core" }
strata-gc = { path = "crates/strata-gc" }
strata-index = { path = "crates/strata-index" }
strata-segment = { path = "crates/strata-segment" }
strata-store = { path = "crates/strata-store" }
tempfile = "3"
thiserror = "2"
tokio = { version = "1.49", features = ["macros", "rt-multi-thread", "time"] }
typed-store = { path = "/Users/sadhansood/dev/walrus/crates/typed-store" }
xxhash-rust = { version = "0.8.15", features = ["xxh3"] }
