[package]
name = "store"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
internal-profiling = []

[dependencies]
prometheus.workspace = true
sha2.workspace = true
core.workspace = true
gc.workspace = true
index.workspace = true
lsm.workspace = true
segment.workspace = true
thiserror.workspace = true
tokio.workspace = true
typed-store.workspace = true
xxhash-rust.workspace = true

[target.'cfg(msim)'.dependencies]
msim = { git = "https://github.com/MystenLabs/mysten-sim.git", rev = "6b8e1e8cdce408e73d46538773fc85a56c082db7" }

[dev-dependencies]
index = { workspace = true, features = ["test-utils"] }
tempfile.workspace = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(msim)'] }
